<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinAI · Геймификация</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Один светлый вид, как в продукте FinAI. Токены совпадают с прототипом отчётов. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --ink:#13181b; --ink2:#485056; --ink3:#8a959d;
  --line:#d5dfe6; --line2:#e8eef2; --chip:#edf0f2; --hover:#f7f9fb;
  --accent:#199af0; --accent-ink:#0b7ecb; --accent-soft:#e2f1fb;
  --ok:#1a9e32; --ok-soft:#e3f4e7; --warn:#b7791f; --warn-soft:#fff4dc; --danger:#c4202f; --danger-soft:#fde8ea;
  --g1:#58FF6E; --g2:#05C5C8; --g3:#00E2FF; --g4:#1999EE; --g5:#99AFFE;
  --glow:0 0 0 1px rgba(5,197,200,.35),0 8px 28px rgba(25,153,238,.22);
  --f:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fast:150ms; --base:250ms; --slow:400ms;
  --e-std:cubic-bezier(.2,0,0,1); --e-spring:cubic-bezier(.34,1.56,.64,1); --e-exit:cubic-bezier(.4,0,1,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}

.app{display:flex;min-height:100%}
/* global sidebar — как в продукте: узкая иконочная рейка на фоне страницы */
.side{flex:0 0 60px;width:60px;display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:10px;position:sticky;top:0;height:100vh}
.logo{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.gsep{width:20px;height:1px;background:var(--line)}
.nav{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink);padding:0;transition:box-shadow var(--fast),color var(--fast)}
.nav:hover{background:var(--hover)}
.nav[aria-current="page"]{box-shadow:0 0 0 1px rgba(25,154,240,.3) inset;color:var(--accent-ink)}
.nav.deco{cursor:default}
.nav .cnt{position:absolute;top:-6px;right:-10px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 4px;border:1.5px solid var(--bg);line-height:12px}
.nav .cnt.okc{background:var(--ok)}
[data-tip]:hover:after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:500;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:100;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.me{width:40px;height:40px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;position:relative;background:conic-gradient(var(--g2) 0 var(--p,0%),var(--line) var(--p,0%) 100%);transition:box-shadow var(--base)}
.me:hover{box-shadow:var(--glow)}
.me .ava{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.me .lv{position:absolute;bottom:-4px;right:-6px;background:var(--surface);color:var(--accent-ink);font-size:9px;font-weight:700;border-radius:8px;padding:1px 4px;box-shadow:0 1px 3px rgba(19,24,27,.18)}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{padding:16px 24px 8px 8px;display:flex;flex-direction:column;gap:4px}
.crumbs{font-size:12px;color:var(--ink3);display:flex;gap:6px}
.crumbs span+span:before{content:"/";margin-right:6px}
.titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.titlerow h1{font-size:18px;font-weight:700}
.info{width:20px;height:20px;border:0;background:transparent;padding:2px;color:var(--ink3);display:grid;place-items:center;border-radius:6px}
.info:hover{background:var(--chip);color:var(--ink2)}
.badges{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.badge{height:28px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;border:0;position:relative}
.b-def{background:var(--chip);color:var(--ink2)}
.b-acc{background:var(--accent-soft);color:var(--accent-ink)}
.b-pos{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-neg{background:var(--danger-soft);color:var(--danger)}
.badge.sm{height:22px;font-size:12px;padding:0 8px;border-radius:6px}
button.badge:hover{filter:brightness(.97)}
.bump{animation:bump 520ms var(--e-spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.float{position:absolute;right:4px;top:-4px;font-weight:700;color:var(--ok);pointer-events:none;animation:floatup 1100ms var(--e-std) forwards;font-size:13px}
@keyframes floatup{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-26px)}}
.content{padding:12px 24px 120px 8px;flex:1}

/* segments */
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 14px;border-radius:8px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(19,24,27,.12)}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}

/* tasks */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:14px;border:1px solid var(--line2)}
.task{padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:14px;transition:box-shadow var(--fast),border-color var(--fast),opacity var(--slow) var(--e-exit),transform var(--slow) var(--e-exit),max-height var(--slow) var(--e-exit),padding var(--slow),margin var(--slow);max-height:200px;overflow:hidden}
.task:hover{border-color:var(--line)}
.task[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.task.gone{opacity:0;transform:translateX(24px);max-height:0;padding-block:0;margin-top:-8px;border-width:0}
.task .meta{display:flex;gap:8px;color:var(--ink3);font-size:12px;flex-wrap:wrap;align-items:center}
.task b{font-weight:600}
.detail{padding:24px;display:flex;flex-direction:column;gap:18px;position:sticky;top:16px}
.detail h2{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:500}
.route{display:flex;gap:0;align-items:center;font-size:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--chip);color:var(--ink2)}
.step.done{background:var(--ok-soft);color:var(--ok)}
.step.cur{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.arrow{width:16px;height:1px;background:var(--line);margin:0 4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line2);padding-top:16px}
.btn{height:40px;padding:0 18px;border-radius:10px;border:1px solid transparent;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--base) var(--e-std),color var(--base),transform var(--fast),min-width var(--base);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{background:var(--hover)}
.btn.ghost{background:transparent;color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{height:32px;padding:0 12px;border-radius:8px;font-size:13px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chk path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 380ms 60ms var(--e-std) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);transition:border-color var(--fast)}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none}

/* empty states */
.empty{padding:32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.empty img{width:min(320px,100%);animation:bob 3.2s ease-in-out infinite}
.empty h2{font-size:20px}
.empty p{color:var(--ink2);max-width:420px}
.stars{display:flex;gap:4px;justify-content:center}
.stars button{border:0;background:transparent;font-size:26px;color:var(--line);padding:0 2px;transition:color var(--fast),transform var(--fast)}
.stars button.on,.stars button:hover{color:#ffb020}
.stars button:hover{transform:scale(1.15)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* toasts */
.toasts{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:60;width:min(300px,calc(100vw - 32px))}
/* «Vertical Notification» из библиотеки: иллюстрация сверху, заголовок, текст, серая кнопка действия */
.toast{width:100%;background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px rgba(5,197,200,.28),0 0 22px rgba(0,226,255,.22),0 12px 30px rgba(19,24,27,.12);display:flex;flex-direction:column;gap:4px;padding:14px 16px 14px;animation:tin var(--slow) var(--e-spring);position:relative;overflow:hidden}
.toast.out{animation:tout var(--base) var(--e-exit) forwards}
.toast .ill{width:72px;height:72px;object-fit:contain;margin:-2px 0 4px -4px}
.toast .ill.cat{animation:bob 2.4s ease-in-out infinite}
.toast b{display:block;font-size:14px;font-weight:600;padding-right:22px}
.toast span{color:var(--ink2);font-size:13px;line-height:1.4}
.toast .act{align-self:flex-start;margin-top:8px;height:28px;padding:0 12px;border-radius:8px;border:0;background:var(--chip);font-size:12px;font-weight:600;color:var(--ink)}
.toast .act:hover{background:var(--line2)}
.toast .x{position:absolute;top:10px;right:10px;border:0;background:transparent;color:var(--ink3);width:24px;height:24px;border-radius:6px;font-size:14px}
.toast .x:hover{background:var(--chip)}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--g2),var(--g4));animation:bar 6s linear forwards}
.toast:hover .bar{animation-play-state:paused}
/* центр уведомлений */
.npanel{max-height:min(520px,calc(100vh - 40px));overflow:auto;padding:12px 6px 6px}
.npanel h5{padding:0 8px}
.nitem{display:flex;gap:10px;padding:10px 8px;border-top:1px solid var(--line2);font-size:13px;align-items:flex-start}
.nitem img{width:40px;height:40px;object-fit:contain;flex:0 0 40px}
.nitem b{display:block;font-weight:600}
.nitem span{color:var(--ink2)}
.nitem small{display:block;color:var(--ink3);font-size:11px;margin-top:2px}
.nitem.unread{background:linear-gradient(90deg,rgba(0,226,255,.08),transparent)}
.gam.full{background:var(--ok-soft);color:var(--ok)}
@keyframes bar{from{width:100%}to{width:0}}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(19,24,27,.42);display:grid;place-items:center;z-index:70;animation:fade var(--base) var(--e-std);padding:16px}
.modal{background:var(--surface);border-radius:20px;width:min(480px,100%);padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:pop var(--slow) var(--e-spring);position:relative}
.modal .hero{width:100%;height:220px;border-radius:14px;background:radial-gradient(120% 90% at 50% 100%,#dff9ff 0,#eef3ff 55%,#f7f9fb 100%);display:grid;place-items:center;overflow:hidden}
.modal .hero img{height:210px;animation:hop 1400ms var(--e-spring) 1, bob 3s ease-in-out 1.4s infinite}
.modal h2{font-size:22px;font-weight:700}
.modal p{color:var(--ink2)}
.modal .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.modal .acts{display:flex;gap:8px;width:100%;margin-top:6px}
.modal .acts .btn{flex:1}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes hop{0%{transform:translateY(40px) scale(.8);opacity:0}60%{transform:translateY(-12px) scale(1.04);opacity:1}100%{transform:none}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:80}

/* requests */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink3);font-weight:500;padding:10px 16px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.new td{animation:rowin 1200ms var(--e-std)}
@keyframes rowin{from{background:var(--ok-soft)}}
.tblwrap{overflow-x:auto}
.form{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2);font-weight:500}
label.f.done>span:after{content:" ✓";color:var(--ok)}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.aside{background:var(--hover);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:16px}
.pbar{height:8px;border-radius:8px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g4));border-radius:8px;transition:width var(--slow) var(--e-std)}
.pbar.pos i{background:linear-gradient(90deg,var(--g2),var(--ok))}
.aside img{width:150px;align-self:center;transition:transform var(--slow) var(--e-spring)}
.aside .hint{font-size:13px;color:var(--ink2)}
.sent{padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.sent img{width:260px}

/* cabinet */
.levelcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding:24px;background:linear-gradient(120deg,#ffffff 0,#f1fbff 60%,#eef1ff 100%)}
.levelcard img{width:140px;height:140px;object-fit:contain}
.levelcard h2{font-size:24px}
.levelcard .sub{color:var(--ink2)}
.lvlsteps{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.lvlsteps span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--ink3)}
.lvlsteps span.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.stat{text-align:right}
.stat b{font-size:32px;display:block;line-height:1}
.stat small{color:var(--ink3)}
.asec{margin-top:28px}
.asec h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.asec h3 small{font-weight:500;color:var(--ink3);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ach{padding:16px;display:flex;gap:14px;align-items:flex-start;transition:box-shadow var(--base)}
.ach img{width:64px;height:64px;flex:0 0 64px;object-fit:contain;transition:filter var(--slow)}
.ach.lock img{filter:grayscale(1) opacity(.45)}
.ach.prog img{filter:grayscale(.6) opacity(.75)}
.ach h4{font-size:14px;font-weight:600}
.ach p{font-size:12px;color:var(--ink3);margin:2px 0 8px}
.ach .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ach .pbar{height:6px;margin-bottom:8px}
.ach.fresh{box-shadow:var(--glow);animation:glow 1.6s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--g2),0 8px 32px rgba(5,197,200,.4)}}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:16px}
.hist{padding:8px 0}
.hist div{display:flex;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line2);font-size:13px;gap:12px}
.hist div:last-child{border:0}
.hist em{font-style:normal;color:var(--ok);font-weight:600;white-space:nowrap}
.hist small{color:var(--ink3);display:block}
.next{padding:18px;display:flex;flex-direction:column;gap:14px}

/* demo strip */
.demo{position:fixed;left:calc(76px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;background:#23262f;color:#fff;border-radius:14px;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 92px)}
.demo b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--g1);padding:0 6px}
.demo button{height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:12px;font-weight:500;padding:0 10px}
.demo button:hover{background:rgba(255,255,255,.1)}
.demo .x{border:0;color:rgba(255,255,255,.6)}
.demofab{position:fixed;left:76px;bottom:16px;z-index:55;height:28px;border-radius:999px;border:0;background:#23262f;color:var(--g1);font-size:11px;padding:0 12px;text-transform:uppercase;letter-spacing:.08em}

.tip{position:fixed;z-index:90;max-width:320px;background:var(--ink);color:#fff;font-size:12px;padding:10px 12px;border-radius:10px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.2)}

@media (max-width:1100px){.split,.two,.form{grid-template-columns:1fr}.detail{position:static}.demo{max-width:calc(100vw - 280px)}}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{position:sticky;top:0;z-index:20;width:auto;height:auto;flex:none;flex-direction:row;background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line2)}
  .gsep{width:1px;height:20px}.side .grow{display:none}.nav.deco{display:none}[data-tip]:hover:after{display:none}
  .head,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fields{grid-template-columns:1fr}.levelcard{grid-template-columns:1fr;text-align:center}.levelcard img{margin:auto}.stat{text-align:center}
  .demo,.demofab{left:16px;max-width:calc(100vw - 32px)}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .toast,.modal,.ovl{animation:fade 200ms!important}
}
/* ── шапка страницы ── */
.head{padding:14px 24px 10px 8px;display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}
.hrow h1{font-size:18px;font-weight:600}
.crumb16{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink3);min-width:0;flex-wrap:wrap}
.crumb16 button{border:0;background:none;padding:0;color:var(--ink3);font-size:16px}
.crumb16 button:hover{color:var(--ink2)}
.crumb16 .sep{color:var(--line)}
.crumb16 .cur{color:var(--ink);font-weight:500}
.useful{margin-left:auto;border:0;background:none;color:var(--accent-ink);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;padding:4px}
.hbadge{height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:0;position:relative}
.hb-warn{background:#ffeedd;color:#e8590c}.hb-def{background:var(--chip);color:var(--ink2)}.hb-acc{background:var(--accent-soft);color:var(--accent-ink)}.hb-pos{background:var(--ok-soft);color:var(--ok)}.hb-neg{background:var(--danger-soft);color:var(--danger)}.hb-wa2{background:var(--warn-soft);color:var(--warn)}
button.hbadge:hover{filter:brightness(.97)}

/* ── пилюли-сегменты и круглые кнопки ── */
.seg.pill{border-radius:999px;background:var(--chip)}
.seg.pill button{border-radius:999px;height:32px;padding:0 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.seg.pill .n{font-size:11px;color:var(--ink3);font-weight:500}
.rbtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;color:var(--ink2)}
.rbtn:hover{background:var(--line2)}

/* ── плитка задач ── */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.tgrid.list{grid-template-columns:1fr}
.tcard{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px;border:0;text-align:left;cursor:pointer;transition:box-shadow var(--base) var(--e-std),transform var(--base) var(--e-std);min-width:0}
.tcard:hover{box-shadow:0 6px 22px rgba(19,24,27,.08);transform:translateY(-1px)}
div.tcard{cursor:default}div.tcard:hover{transform:none;box-shadow:none}
.tgrid.list .tcard{min-height:0;display:grid;grid-template-columns:120px minmax(0,1fr) auto;align-items:center;gap:12px}
.tgrid.list .tcard .tags{display:none}
.tcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard h3{font-size:15px;font-weight:500;line-height:1.3}
.st{height:22px;padding:0 8px;border-radius:999px;font-size:12px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.st.new{background:var(--accent-soft);color:var(--accent-ink)}
.st.work{background:#ffeedd;color:#e8590c}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.ret{background:var(--warn-soft);color:var(--warn)}
.st.rej{background:var(--danger-soft);color:var(--danger)}
.ptsc{color:var(--accent-ink);font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{height:22px;padding:0 8px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.role{background:var(--accent-soft);color:var(--accent-ink)}
.tfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tgrid.list .tfoot{margin:0}
.date{height:24px;padding:0 8px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px}
.date.hot{background:var(--danger-soft);color:var(--danger)}
.aa{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:600;display:grid;place-items:center;flex:0 0 32px}

/* ── оценка CSAT ── */
.csat{order:99;background:var(--surface);border-radius:20px;padding:18px 18px 14px;text-align:center;box-shadow:var(--glow),0 12px 36px rgba(19,24,27,.16);position:relative;animation:tin var(--slow) var(--e-spring)}
.csat h4{font-size:16px;font-weight:600;padding:0 20px}
.csat .stars{margin:12px 0}
.csat .stars button{font-size:30px}
.csat .send{width:100%;height:32px;border-radius:10px;border:0;background:var(--chip);font-weight:600;font-size:13px}
.csat .send:not([disabled]){background:var(--accent);color:#fff}
.csat .x{position:absolute;top:10px;right:10px;border:0;background:transparent;color:var(--ink3);width:24px;height:24px}

/* ── карточка инициативы ── */
.inibar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.inibar .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn.chip{background:var(--chip);color:var(--ink);border-radius:999px;height:32px;padding:0 14px;font-size:13px}
.btn.chip:hover{background:var(--line2)}
.btn.pill{border-radius:999px;height:32px;padding:0 14px;font-size:13px}
.ini{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.ini-main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ini-row2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.box{background:var(--surface);border-radius:16px;padding:16px 18px;min-width:0}
.box h3{font-size:18px;font-weight:600;margin-bottom:12px}
.prow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:14px;align-items:center}
.prow:last-child{border:0}
.prow span:first-child{color:var(--ink2);display:flex;gap:8px;align-items:center}
.prow span:first-child svg{color:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.kpis small{display:block;color:var(--ink3);font-size:13px}
.kpis b{font-size:22px;font-weight:500}
.box.grad{background:linear-gradient(200deg,#d9efff 0,#ffffff 45%)}
.qs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px;font-size:13px}
.qs small{display:block;color:var(--ink3)}
.qs b{font-weight:500;font-size:15px}
.fld{margin-bottom:12px}.fld small{display:block;color:var(--ink3);font-size:12px;margin-bottom:2px}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.links div{border:1px solid var(--line);border-radius:10px;padding:10px;height:96px;display:flex;flex-direction:column;justify-content:space-between;font-size:14px;color:var(--ink2)}
.retpanel{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 1px var(--line);animation:tin var(--base) var(--e-std)}
/* маршрут согласования */
.tl{display:flex;flex-direction:column;padding:4px 0 0}
.tlg{position:relative;padding:0 0 18px 26px}
.tlg:before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.tlg:last-child:before{display:none}
.tlg.green:before{background:var(--ok)}
.tlg>.dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:var(--line);border:3px solid var(--bg);box-sizing:content-box;margin:-3px}
.tlg.green>.dot{background:var(--ok)}
.tlg.orange>.dot{background:var(--surface);box-shadow:inset 0 0 0 2px #f27a1a}
.tlg h4{font-size:17px;font-weight:500;color:var(--ink3);margin-bottom:6px}
.tlg.green h4{color:var(--ok)}.tlg.orange h4{color:#e8590c}
.tls{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px;transition:background var(--slow)}
.tls:last-child{border:0}
.tls i{flex:0 0 14px;width:14px;height:14px;border-radius:50%;background:var(--line2);margin-top:2px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:9px}
.tls.ok i{background:var(--ok)}
.tls.cur i{background:#f27a1a}
.tls.ret i{background:var(--warn)}
.tls.rej i{background:var(--danger)}
.tls.pend{color:var(--ink2)}
.tls small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.tls.flash{animation:flash 1.4s var(--e-std)}
@keyframes flash{from{background:var(--ok-soft)}}

/* ── модалка успеха (по макету) ── */
.modal{padding:0 0 22px;overflow:hidden;gap:10px}
.modal .hero{height:200px;border-radius:0;background:radial-gradient(70% 95% at 50% 0%,rgba(88,255,110,.55) 0,rgba(5,197,200,.18) 45%,rgba(255,255,255,0) 75%),var(--surface)}
.modal .hero img{height:190px}
.modal .mx{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--chip);color:var(--ink2);font-size:14px}
.modal .tt{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 24px}
.modal h2{font-size:18px;font-weight:600}
.modal p{padding:0 24px;font-size:13px}
.modal .acts{padding:0 24px;justify-content:center}
.modal .acts .btn{flex:0 1 auto;height:36px;font-size:13px}

/* ── отчёты ── */
.rep{display:grid;grid-template-columns:280px minmax(0,1fr);gap:8px;align-items:start}
.rcat{padding:16px 10px}
.rcat h3{font-size:18px;padding:0 8px;margin-bottom:12px}
.grp{font-size:14px;color:var(--ink);padding:8px;display:flex;align-items:center;gap:6px}
.grp .cnt2{margin-left:auto;font-size:11px;background:var(--chip);border-radius:999px;padding:1px 7px;color:var(--ink2)}
.ritem{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 22px;border-radius:10px;font-size:13.5px;color:var(--ink);min-width:0}
.ritem span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem.cur{background:var(--chip)}
.ritem small{display:block;color:var(--ink3);font-size:11px}
.starb{border:0;background:transparent;color:var(--ink3);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 26px}
.starb.on{color:#f2a516}
.starb:hover{background:var(--line2)}
.rtab{padding:0;overflow:hidden}
.rtool{display:flex;gap:6px;align-items:center;padding:10px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.rtool .search{flex:1;min-width:160px;display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:13px;padding:0 8px}
.tb{height:32px;border-radius:8px;border:0;background:var(--chip);padding:0 10px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;color:var(--ink);white-space:nowrap}
.tb:hover{background:var(--line2)}
.tb.on{background:var(--accent-soft);color:var(--accent-ink)}
.tb.done{box-shadow:inset 0 0 0 1px rgba(26,158,50,.35)}
.rflt{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.fchip{height:24px;border-radius:6px;background:var(--chip);padding:0 8px;display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--ink);animation:tin var(--base) var(--e-spring)}
.fchip button{border:0;background:none;padding:0;color:var(--ink3);font-size:12px}
.fchip.view{background:var(--accent-soft);color:var(--accent-ink)}
.rtbl{overflow:auto;max-height:calc(100vh - 230px)}
.rtbl table{font-size:13px;min-width:760px}
.rtbl th{background:#ecf6fc;color:var(--ink);font-weight:600;position:sticky;top:0;padding:8px 12px;border-bottom:1px solid var(--line)}
.rtbl th.num,.rtbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.rtbl td{padding:7px 12px}
.rtbl tr.bank td{font-weight:600;background:#f7fbfe}
.rtbl tr:hover td{background:var(--hover)}
.ib{border:0;background:none;padding:0 0 0 4px;color:var(--accent);vertical-align:-2px}
.sorted{color:var(--accent-ink)}
/* кольцо прогресса «Путь аналитика» */
.gam{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:999px;border:0;background:var(--chip);font-weight:600;font-size:13px;color:var(--ink);position:relative}
.gam:hover{box-shadow:var(--glow)}
.gam circle.v{transition:stroke-dashoffset .7s var(--e-std)}
.pop{position:fixed;z-index:65;background:var(--surface);border-radius:14px;box-shadow:0 12px 40px rgba(19,24,27,.22);border:1px solid var(--line2);padding:12px;animation:tin var(--base) var(--e-std);max-width:calc(100vw - 32px)}
.pop h5{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop .glvl{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.gitem{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line2);font-size:13px}
.gitem img{width:30px;height:30px;flex:0 0 30px;filter:grayscale(1) opacity(.5)}
.gitem.ok img{filter:none}
.gitem .sub2{font-size:11.5px;color:var(--ink3);line-height:1.35}
.gitem .xp{font-size:11px;font-weight:700;color:var(--ink3);white-space:nowrap}
.gitem.ok .xp{color:var(--ok)}
.gitem.ok b{color:var(--ink2)}
.popbtn{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:13px}
.popbtn:hover{background:var(--hover)}
.burst{position:fixed;z-index:85;pointer-events:none;width:0;height:0}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c);animation:burst 700ms var(--e-std) forwards}
@keyframes burst{from{transform:rotate(var(--a)) translateX(0);opacity:1}to{transform:rotate(var(--a)) translateX(var(--d));opacity:0}}
.popstar{animation:bump 520ms var(--e-spring)}

@media (max-width:1200px){.ini{grid-template-columns:1fr}.ini-main{grid-template-columns:1fr 1fr}.rep{grid-template-columns:1fr}}
@media (max-width:760px){.ini-main,.ini-row2{grid-template-columns:1fr}.prow{grid-template-columns:1fr}.links{grid-template-columns:1fr}.inibar .acts{margin-left:0}.useful{margin-left:0}.qs{grid-template-columns:repeat(3,1fr)}}

</style>
</head>
<body>


<div class="app">
  <nav class="side" aria-label="Разделы FinAI">
    <div class="logo" title="FinAI"><svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="16" fill="#202e3d"/><circle cx="16" cy="16" r="7" fill="#25deef"/><circle cx="32" cy="16" r="7" fill="#25deef"/><circle cx="48" cy="16" r="7" fill="#009efd"/><circle cx="16" cy="32" r="7" fill="#47f991"/><circle cx="32" cy="32" r="7" fill="#25deef"/><circle cx="16" cy="48" r="7" fill="#ad91fc"/></svg></div>

    <button class="nav" data-go="rep" data-tip="Отчёты" aria-label="Отчёты"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9.5 9.5v10"/></svg></button>
    <button class="nav" data-go="cab" data-tip="Достижения" aria-label="Достижения"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM6 5H4v2a3 3 0 0 0 3 3M18 5h2v2a3 3 0 0 1-3 3M12 13v4M8.5 20.5h7M9.5 17h5"/></svg><span class="cnt okc" id="achcnt" hidden></span></button>
    <div class="grow" style="flex:1"></div>
    <button class="nav deco" data-tip="Ещё" aria-label="Ещё"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></button>
    <button class="nav deco" data-tip="Помощь" aria-label="Помощь"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.4 2.4c-.7.3-.9.8-.9 1.6"/><path d="M12 16.6v.4"/></svg></button>
    <button class="nav" id="bell" data-popbtn data-tip="Уведомления" aria-label="Уведомления"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10a6 6 0 1 1 12 0c0 3 1 4.5 2 5.5H4c1-1 2-2.5 2-5.5z"/><path d="M9.5 18.5a2.5 2.5 0 0 0 5 0"/></svg><span class="cnt" id="bellcnt">99+</span></button>
    <button class="me" data-go="cab" id="me"></button>

  <main class="main">

<script>
/* ============ ДАННЫЕ ============ */
const IMG=n=>'img/'+n+'.png';
const LEVELS=[
  {name:'Новичок',min:0,img:'lvl_novice'},
  {name:'Практик',min:200,img:'lvl_confident'},
  {name:'Эксперт',min:600,img:'lvl_expert'},
  {name:'Лидер эффективности',min:1500,img:'lvl_expert'}];
const ACH=[
 {id:'no_tails',sec:'Задачи',name:'Без хвостов',desc:'Закрыть все задачи за день',pts:15,img:'ach_focus',goal:1,v:s=>s.allClosed?1:0},
 {id:'punctual',sec:'Задачи',name:'Пунктуальность',desc:'5 дней подряд без просрочек',pts:30,img:'ach_collector',goal:5,v:s=>5},
 {id:'first_appr',sec:'Согласование',name:'Первое согласование',desc:'Согласовать первую инициативу',pts:50,img:'ach_rating',goal:1,v:s=>s.approvals},
 {id:'partner',sec:'Согласование',name:'Надёжный партнёр',desc:'10 согласований без просрочек',pts:100,img:'ach_collector',goal:10,v:s=>s.approvals},
 {id:'speed',sec:'Согласование',name:'Скорость света',desc:'5 согласований в день поступления',pts:50,img:'ach_focus',goal:5,v:s=>s.apprToday},
 {id:'first_req',sec:'Заявки',name:'Ваша первая заявка',desc:'Отправить первую заявку',pts:50,img:'ach_method',goal:1,v:s=>s.requests},
 {id:'clean',sec:'Заявки',name:'Чистая работа',desc:'4 заявки подряд без возвратов',pts:40,img:'ach_view',goal:4,v:s=>s.reqClean},
 {id:'budget',sec:'Заявки',name:'Утверждение бюджета',desc:'Заявка прошла весь маршрут',pts:100,img:'ach_rating',goal:1,v:s=>s.budgets},

// начисление: общий счёт, счёт недели, история; возвращает новый уровень, если он сменился
function award(p,t){const before=lvlOf(S.points);S.points+=p;S.week+=p;S.hist.unshift({t,d:'Сегодня',p});const after=lvlOf(S.points);floatPts(p);return after>before?after:null}
function checkAch(){const out=[];ACH.forEach(a=>{if(S.unlocked.includes(a.id))return;if(a.v(S)>=a.goal){S.unlocked.push(a.id);S.fresh.push(a.id);out.push(a)}});return out}
/* Правила: не больше одной модалки за сессию; рутинные тосты — не чаще раза в 30 с; достижения показываем всегда */
function celebrate(evs){
  let lv=null;
  evs.filter(e=>e.kind==='ach').forEach(e=>{const l=award(e.a.pts,'Достижение «'+e.a.name+'»');if(l!=null)lv=l});
  evs.filter(e=>e.kind==='bonus').forEach(e=>{const l=award(e.pts,e.t);if(l!=null)lv=l});
  if(lv!=null)evs.push({kind:'level',lv,big:true});
  // «Эксперт отчётов» — всегда модалка (так задано в сценарии отчётов); остальные большие события — одна модалка за сессию
  const forced=evs.find(e=>e.kind==='ach'&&e.a.id==='rep_exp');
  const bigs=evs.filter(e=>e.big);
  let modalEv=null;
  if(forced)modalEv=forced;else if(bigs.length&&!S.modalShown)modalEv=bigs[0];
  if(modalEv){S.modalShown=true;confetti()}else if(bigs.length)confetti(.5);
  // порядок показа: достижения через 500 мс друг за другом, уровень — через 300 мс после последнего
  const lvlLike=e=>e.kind==='level'||(e.kind==='ach'&&e.a.id==='rep_conf');
  const q=evs.filter(e=>e!==modalEv&&!lvlLike(e)).concat(evs.filter(e=>e!==modalEv&&lvlLike(e)));
  let d=300,last=0;
  q.forEach((e,k)=>{
    if(k>0)d+=lvlLike(e)?300:500;
    const at=d;
    setTimeout(()=>notifyEv(e),at);last=at;
  });
  if(modalEv)setTimeout(()=>showModal(modalEv),q.length?last+300:150);
  save();render();
}
function notifyEv(e){
  if(e.kind==='goal')return toast({img:IMG(e.g.img),title:'Достижение «'+e.g.t+'»',text:e.text,act:['Путь аналитика','gam']});
  if(e.kind==='ach'&&e.a.id==='rep_conf')return toast({img:IMG('lvl_confident'),cat:1,title:'Новый уровень: «Уверенный пользователь»',text:'+30 баллов. Откройте ещё возможности отчёта — до «Эксперта» три шага',act:['Путь аналитика','gam']});
  if(e.kind==='ach'&&e.a.id==='team')return; // дублирует цель «Командный игрок» из «Пути аналитика»
  if(e.kind==='ach'&&e.a.id==='first_req')return toast({img:IMG(e.a.img),title:'Достижение «Ваша первая заявка»',text:'+50 баллов. Следующее — «Чистая работа»: 4 заявки подряд без возвратов',act:['Открыть кабинет','cab']});
  if(e.kind==='ach')return toast({img:IMG(e.a.img),title:'Достижение «'+e.a.name+'»',text:'+'+e.a.pts+' баллов · '+e.a.desc,act:['Открыть кабинет','cab']});
  if(e.kind==='level'){const L=LEVELS[e.lv];return toast({img:IMG(L.img),cat:1,title:'Новый уровень: «'+L.name+'»',text:'Вы набрали '+fmt(S.points)+' баллов. Новые достижения ждут в кабинете',act:['Открыть кабинет','cab']})}
  if(e.kind==='milestone')return toast({img:IMG('finni_done'),cat:1,title:e.n+' согласований!',text:'+100 баллов за круглую цифру',act:['Открыть кабинет','cab']});
  if(e.kind==='bonus')return toast({img:IMG('finni_done'),cat:1,title:e.t,text:'+'+e.pts+' баллов',act:['Открыть кабинет','cab']});
  if(e.kind==='routine'){const now=Date.now();
    if(!UI.throttle||now-S.lastToast>30000){S.lastToast=now;toast({img:IMG(e.img||'finni_done'),cat:1,title:e.title,text:e.text,act:e.act})}
    else logNotif({img:IMG(e.img||'finni_done'),title:e.title,text:e.text})}
}

function closeTask(t,kind){
  S.tasks=S.tasks.filter(x=>x.id!==t.id);
  S.dayDone++;
  const evs=[];let got=0;
  if(kind==='appr'){
    S.approvals++;S.noReturn++;if(t.hot)S.apprToday++;
    award(10,'Согласование «'+t.ini+'»');got=10;
    if(MILESTONES.includes(S.approvals)&&S.approvals>1){award(100,'Веха: '+S.approvals+' согласований');got+=100;evs.push({kind:'milestone',big:true,n:S.approvals})}
  } else if(kind==='task'){award(5,'Доработка в срок');got=5}
  else {S.noReturn=0}
  S.archive.unshift(Object.assign({},t,{res:kind,got}));
  if(S.dayDone>=S.dayGoal&&!S.dayGoalPaid){S.dayGoalPaid=true;evs.push({kind:'bonus',pts:15,t:'Цель дня выполнена — '+S.dayGoal+' из '+S.dayGoal})}
  if(!S.tasks.length)S.allClosed=true;
  checkAch().forEach(a=>evs.push(a.id==='first_appr'?{kind:'ach',a,big:true}:{kind:'ach',a}));
  const first=evs.find(e=>e.kind==='ach'&&e.a.id==='first_appr');
  if(first)evs.sort((a,b)=>(b===first)-(a===first));
  if(!evs.some(e=>e.big)){
    const n=S.noReturn;
    if(kind==='appr')evs.unshift({kind:'routine',title:'Инициатива согласована',text:'+10 баллов · '+(n>=3?n+' '+plural(n,'согласование','согласования','согласований')+' подряд без возвратов':'передана Руководителю ДИТ'),act:['К реестру','tasks']});
    if(kind==='task')evs.unshift({kind:'routine',title:'Отправлено на согласование',text:'+5 баллов · доработка сдана в срок',act:['К реестру','tasks']});
    if(kind==='ret')toast({img:IMG('finni_empty'),title:'Инициатива возвращена автору',text:'Серия «без возвратов» начнётся заново'});
    if(kind==='rej')toast({img:IMG('finni_empty'),title:'Инициатива отклонена',text:'Автор получит уведомление с причиной'});
  }
  celebrate(evs);
  if(S.approvals>=3&&!S.csatShown)setTimeout(showCsat,2600);
}

function confetti(k=1){
  if(reduce)return;
  const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#58FF6E','#05C5C8','#00E2FF','#1999EE','#99AFFE','#ffd166'];
  const P=Array.from({length:Math.round(160*k)},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-5,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],s:Math.random()<.5}));
  const t0=performance.now();
  (function f(t){const dt=t-t0;x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-dt/2200);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      if(p.s)x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{x.beginPath();x.arc(0,0,p.r/2.4,0,7);x.fill()}x.restore()});
    if(dt<2200)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})(t0);
}

}
function demo(k){
  if(k==='hide'){demoOpen=false;return vDemo()} if(k==='show'){demoOpen=true;return vDemo()}
  if(k==='thr'){UI.throttle=!UI.throttle;return vDemo()}
  S=fresh();UI.seg='all';UI.form=null;UI.sent=null;UI.rep={};UI.view='tasks';
  if(k==='ms'){S.approvals=9;S.apprToday=1;S.points=345;S.week=160;S.unlocked.push('first_appr');S.noReturn=9}
  if(k==='lvl'){S.points=188}
  if(k==='done'){S.tasks=S.tasks.slice(0,1);S.dayDone=4}
  if(k==='rep5'){S.repGoals=['fav','filter','sort','save','gloss'];S.points+=80;S.unlocked.push('rep_conf');UI.view='rep';UI.rep={fav:true,sort:true,filter:null,view:'Прибыль 2026 по банкам'}}
  $('#toasts').innerHTML='';closeModal();save();render();window.scrollTo(0,0);
}

/* ============ СОБЫТИЯ ============ */
document.addEventListener('click',e=>{
  const T=e.target;
  const inPop=T.closest('#pop');
  if(!inPop&&!T.closest('[data-popbtn]'))closePop();
  if(T.closest('[data-close]'))closeModal();
  if(T.classList.contains('ovl'))closeModal();
  const g=T.closest('[data-go]');
  if(g&&g.dataset.go){UI.view=g.dataset.go;UI.sent=null;if(UI.view!=='req')UI.form=null;render();window.scrollTo(0,0);return}
  const d=T.closest('[data-demo]');if(d)return demo(d.dataset.demo);
  if(T.closest('[data-gam]')){if(UI.view!=='rep'){UI.view='rep';render()}setTimeout(()=>{const g=$('#gambtn');g&&gamPop(g)},30);return}
  const s=T.closest('[data-seg]');if(s){UI.seg=s.dataset.seg;UI.view='tasks';return render()}
  const gr=T.closest('[data-grid]');if(gr){UI.grid=gr.dataset.grid==='1';return render()}
  const op=T.closest('[data-open]');if(op){UI.ini=+op.dataset.open;UI.iniTab='Общее';UI.view='ini';render();window.scrollTo(0,0);return}
  const tb=T.closest('[data-tab]');if(tb){UI.iniTab=tb.dataset.tab;return render()}
  const c=T.closest('[data-cab]');if(c){UI.cabVar=c.dataset.cab;return render()}
  const r=T.closest('[data-route]');if(r){r.remove();return runRoute(r.dataset.route)}
  const rg=T.closest('[data-retgo]');if(rg){const k=rg.dataset.retgo;if(k==='cancel'){$('#retroot').innerHTML='';return}
    const t=S.tasks.find(x=>x.id===UI.ini);if(t)closeTask(t,k);return}
  // CSAT
  const cs=T.closest('[data-cs]');if(cs){const n=+cs.dataset.cs;UI.csat=n;document.querySelectorAll('.csat [data-cs]').forEach((b,i)=>b.classList.toggle('on',i<n));$('.csat .send').disabled=false;return}
  const cx=T.closest('[data-csat]');if(cx){const box=$('.csat');if(cx.dataset.csat==='send'){S.reviews++;award(5,'Отзыв о разделе «Задачи»');const evs=checkAch().map(a=>({kind:'ach',a}));
      evs.push({kind:'routine',img:'finni_relax',title:'Спасибо за отзыв! +5 баллов',text:S.reviews<3?'Ещё '+(3-S.reviews)+' — и достижение «Голос пользователя»':'Ваш голос помогает делать FinAI удобнее'});UI.throttle&&(S.lastToast=0);box&&box.remove();celebrate(evs)}
    else box&&box.remove();return}
  // отчёты: всплывающие окна
  const bk=T.closest('[data-bank]');if(bk){UI.rep.filter=bk.dataset.bank;closePop();render();repGoal('filter',$('#fltbtn'));return}
  if(T.closest('[data-clearf]')){UI.rep.filter=null;return render()}
  const btn=T.closest('button');const id=btn&&btn.id;
  if(id==='savego'){const v=($('#viewname').value||'').trim()||'Мой вид';UI.rep.view=v;closePop();render();repGoal('save',$('#savebtn'));return}
  if(id==='sharego'){const who=$('#sharewho').value;closePop();if(S.repGoals.includes('share'))toast({img:IMG('ach_team'),title:'Отчёт отправлен',text:who+' получит ссылку с вашими настройками'});repGoal('share',$('#sharebtn'));return}
  if(id==='gambtn')return gamPop(btn);
  if(id==='bell'){if($('#pop .npanel')){closePop();return}return bellPop(btn)}
  if(id==='fltbtn')return pop(btn,`<h5>Подразделение</h5>${BANKS.map(b=>`<button class="popbtn" data-bank="${b}">${b}${UI.rep.filter===b?' ✓':''}</button>`).join('')}`,260);
  if(id==='savebtn')return pop(btn,`<h5>Сохранить вид таблицы</h5><input type="text" id="viewname" value="${esc(UI.rep.view||'Прибыль 2026 по банкам')}"><p style="font-size:12px;color:var(--ink3);margin:8px 0">Сохранятся фильтры, сортировка и ширина колонок.</p><button class="btn pri sm" id="savego" style="width:100%">Сохранить</button>`,300);
  if(id==='sharebtn')return pop(btn,`<h5>Поделиться отчётом</h5><select id="sharewho"><option>Иванова Е.Н.</option><option>Смирнов Д.А.</option><option>Орлова Е.П.</option></select><p style="font-size:12px;color:var(--ink3);margin:8px 0">Коллега откроет отчёт с вашими фильтрами и видом.</p><button class="btn pri sm" id="sharego" style="width:100%">Поделиться</button>`,300);
  if(id==='glossbtn'){pop(btn,`<h5>Прибыль, руб.</h5><p style="font-size:13px;color:var(--ink2)">Операционная прибыль инициативы: эффекты минус прямые и аллоцированные затраты за календарный год. Источник — методика ФП-12, раздел 3.2.</p>`,320);repGoal('gloss',btn);return}
  if(id==='sortbtn'){UI.rep.sort=!UI.rep.sort;render();if(UI.rep.sort)repGoal('sort',$('#sortbtn'));return}
  if(id==='favbtn'){UI.rep.fav=!UI.rep.fav;render();if(UI.rep.fav)repGoal('fav',$('#favbtn'));return}
  // задачи и инициатива
  if(id==='approve')doApprove(btn);
  if(id==='resend'){btn.disabled=true;btn.innerHTML='<span class="spin"></span>';const t=S.tasks.find(x=>x.id===UI.ini);setTimeout(()=>closeTask(t,'task'),reduce?50:700)}
  if(id==='ret')retPanel('ret');
  if(id==='reject')retPanel('rej');
  // заявки
  if(id==='newreq'){UI.sent=null;UI.form={};render()}
  if(id==='cancel'){UI.form=null;render()}
  if(id==='toreg'){UI.sent=null;render()}
  if(id==='autofill'){UI.form={type:'Бюджетная',cfo:'Финансы',name:'Бюджет на обучение команды казначейства',sum:'340000',why:'Повышение квалификации, снижение ошибок в платёжном календаре',file:true};render()}
  if(id==='submit')submitReq(btn);
  if(id==='infobtn'||id==='useful'){const ex=$('.tip');if(ex){ex.remove();return}const b=btn.getBoundingClientRect();const tp=document.createElement('div');tp.className='tip';tp.textContent=VIEWS[UI.view].info;tp.style.left=Math.max(16,Math.min(b.left,innerWidth-336))+'px';tp.style.top=(b.bottom+8)+'px';document.body.appendChild(tp);setTimeout(()=>tp.remove(),6000)}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(!k||!UI.form)return;
  UI.form[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  // перерисовываем только боковую панель и кнопку, чтобы не терять фокус
  const pos=e.target.selectionStart,focusK=k;vForm();const el=document.querySelector(`[data-f="${focusK}"]`);if(el){el.focus();try{if(pos!=null&&el.setSelectionRange)el.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
